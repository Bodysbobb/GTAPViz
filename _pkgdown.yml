url: https://bodysbobb.github.io/GTAPViz/

template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <link rel="stylesheet" href="mystyle.css">
      <meta name="google-site-verification" content="8QKloLN9mSrDsTaZuR4KAEAmti-k3mYCBZpMVgq2RO8" />

home:
  title: GTAPViz - Visualizing GTAP Results from HAR and SL4 Files
  strip_header: false

navbar:
  structure:
    left: [home, articles, reference, gpt]
    right: [github]
  components:
    home:
      text: "Home"
      href: index.html
    articles:
      text: "Vignettes"
      menu:
        - text: "Data Processing"
          href: articles/GTAPViz_Data.html
        - text: "Plotting"
          href: articles/GTAPViz_Plot.html
        - text: "Table Generation"
          href: articles/GTAPViz_Table.html
        - text: "Advanced Plot Catalogs"
          href: https://pattawee.shinyapps.io/gtapviz-advanced-plot-configs/
        - text: "Advanced Table Catalogs"
          href: https://pattawee.shinyapps.io/gtapviz-advanced-table-configs/
        - text: "Utilities"
          href: articles/GTAPViz_Utilities.html  
    reference:
      text: "References"
      href: reference/index.html
    gpt:
      icon: fas fa-robot
      text: "ChatGPT GTAPViz-R"
      href: https://chatgpt.com/g/g-67f87a78396c81919aa2a0676c40e8b3-gtapviz-r/
    github:
      icon: fab fa-github
      href: https://github.com/Bodysbobb/GTAPViz
      aria-label: "GitHub Repository"

toc:
  depth: 3
  collapse: true
  float: true
  smooth_scroll: true

articles:
  - title: "GTAPViz Vignettes"
    contents:
      - GTAPViz_Data
      - GTAPViz_Plot
      - GTAPViz_Table
