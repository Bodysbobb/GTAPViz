url: https://bodysbobb.github.io/GTAPViz/
template:
  bootstrap: 5
  bootswatch: flatly
  includes:
    in_header: |
      <link rel="stylesheet" href="mystyle.css">
      <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="extra.js"></script>
home:
  title: GTAPViz - Visualizing GTAP Model Results
navbar:
  structure:
    left:  [home, articles, reference]
    right: [github]
  components:
    home:
      text: "Home"
      href: index.html
    reference:
      text: "References"
      href: reference/index.html
    articles:
      text: "Vignettes"
      href: articles/index.html
    github:
      icon: fab fa-github
      href: https://github.com/Bodysbobb/GTAPViz
      aria-label: "GitHub Repository"
toc:
  depth: 3
  collapse: true
  float: true
  smooth_scroll: true
articles:
  - title: "GTAPViz Vignette"
    contents:
      - GTAPViz_vignette
      